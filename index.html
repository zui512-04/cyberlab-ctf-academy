<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CyberLab CTF Academy</title><style>
:root{color-scheme:dark;font-family:system-ui,"Microsoft JhengHei",sans-serif;background:#090f21;color:#e9efff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 85% 0%,#2c235a 0,transparent 40%),#090f21}header{padding:18px 5%;border-bottom:1px solid #303a56;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}h1{font-size:1.3rem;margin:0;color:#b4b5ff}main{max-width:1050px;margin:28px auto;padding:0 18px}.panel{background:#131d36;border:1px solid #2c395a;border-radius:16px;padding:24px;margin:16px 0;box-shadow:0 8px 30px #0002}h2{margin-top:0;font-size:1.2rem}input,select,button{font:inherit;border-radius:9px;padding:11px 13px}input,select{background:#0d162a;color:#fff;border:1px solid #415071;max-width:100%;width:100%;margin:7px 0 14px}button{background:#7368ef;color:white;border:0;cursor:pointer;margin:4px 4px 4px 0}button:hover{filter:brightness(1.12)}button:disabled{opacity:.5;cursor:not-allowed}.secondary{background:#293858}.danger{background:#a84358}.muted{color:#9caed0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.option{display:block;width:100%;text-align:left;background:#202c4a;margin:9px 0;padding:14px}.option.selected{outline:2px solid #aa9aff}.hidden{display:none!important}.top{display:flex;gap:12px;justify-content:space-between;flex-wrap:wrap}.pill{display:inline-block;background:#2b3757;padding:5px 11px;border-radius:20px;margin-bottom:12px}.ok{color:#67d7b1}.bad{color:#ff9da7}table{width:100%;border-collapse:collapse}th,td{border-bottom:1px solid #30405e;padding:11px;text-align:left}small{color:#9caed0}.notice{border-left:3px solid #8e8bff;padding:12px;background:#1b2743;white-space:pre-wrap}#message{min-height:22px;color:#f9c988}label{display:block} @media(max-width:550px){.panel{padding:17px}th,td{padding:7px;font-size:.85rem}}
</style></head><body><header><h1>◈ CyberLab CTF Academy <small>V1.0</small></h1><div id="who" class="muted">尚未登入</div></header><main><p id="message" role="status"></p>
<section id="setup" class="panel hidden"><h2>首次設定</h2><p>請在 <code>config.js</code> 填入 Supabase URL 與公開 anon key，重新部署後即可使用。</p></section>
<section id="auth" class="panel"><h2>登入 / 註冊</h2><div class="grid"><div><label>電子郵件<input id="email" type="email" autocomplete="email"></label><label>密碼（至少 6 字元）<input id="password" type="password" autocomplete="current-password"></label><label>顯示名稱（註冊用）<input id="display" maxlength="32" placeholder="例如：柒"></label><button id="login">登入</button><button id="signup" class="secondary">註冊</button></div><div class="notice">使用 Supabase Auth 管理登入。若啟用 Email 確認，註冊後需先驗證信箱。公開排行榜會顯示你設定的暱稱，請勿使用真實個資。</div></div></section>
<section id="app" class="hidden"><div class="top"><div><button id="home">開始刷題</button><button id="historyBtn" class="secondary">我的紀錄</button><button id="leaderBtn" class="secondary">排行榜</button></div><button id="logout" class="danger">登出</button></div>
<section id="dashboard" class="panel"><h2>建立測驗</h2><div class="grid"><label>模式<select id="mode"><option value="practice">自由練習（每題顯示解析）</option><option value="exam">模擬測驗（交卷顯示解析）</option></select></label><label>題目數量<select id="count"><option>10</option><option>20</option><option>50</option><option>100</option></select></label><label>分類<select id="category"><option value="">全部分類</option></select></label></div><button id="start">開始隨機抽題</button><p class="muted">測驗進度儲存在雲端；離開頁面後，可重新登入並查看已完成紀錄。未完成場次目前不提供續答。</p></section>
<section id="quiz" class="panel hidden"><div class="top"><h2 id="qtitle">題目</h2><span id="progress" class="pill"></span></div><p id="question"></p><div id="options"></div><p id="feedback" class="notice hidden"></p><button id="submit">確認答案</button><button id="next" class="hidden">下一題</button><button id="finish" class="secondary">結束並交卷</button></section>
<section id="result" class="panel hidden"><h2>測驗結果</h2><h3 id="score"></h3><div id="review"></div><button id="again">返回首頁</button></section>
<section id="history" class="panel hidden"><h2>我的刷題紀錄</h2><div id="historyData"></div></section><section id="leaderboard" class="panel hidden"><h2>多人排行榜</h2><div id="leaderData"></div></section></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="config.js"></script><script>
'use strict';const $=id=>document.getElementById(id),show=(id,yes=true)=>$(id).classList.toggle('hidden',!yes);const config=window.CYBERLAB_CONFIG||{};let db=null,user=null,profile=null,sessionId=null,items=[],cursor=0,selected=null,submitted=false,feedbackMap={};const msg=t=>$('message').textContent=t||'';const escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function panel(name){['dashboard','quiz','result','history','leaderboard'].forEach(x=>show(x,x===name));msg('')}
async function call(p){const {data,error}=await p;if(error)throw error;return data}
async function init(){if(!config.url||!config.anonKey||!window.supabase){show('setup');show('auth',false);return}db=window.supabase.createClient(config.url,config.anonKey);db.auth.onAuthStateChange((_event,s)=>{user=s?.user||null;setTimeout(()=>refresh().catch(err=>msg(err.message)),0)});const {data}=await db.auth.getSession();user=data.session?.user||null;await refresh()}
async function refresh(){show('auth',!user);show('app',!!user);if(!user){$('who').textContent='尚未登入';return}let p=await call(db.from('profiles').select('display_name').eq('id',user.id).maybeSingle());if(!p){const name=(user.user_metadata?.display_name||'Learner').slice(0,32);await call(db.from('profiles').upsert({id:user.id,display_name:name}));p={display_name:name}}profile=p;$('who').textContent=p.display_name;await categories();panel('dashboard')}
async function categories(){let rows=await call(db.from('questions').select('category'));let cats=[...new Set(rows.map(r=>r.category))].sort();$('category').innerHTML='<option value="">全部分類</option>'+cats.map(c=>`<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('')}
$('signup').onclick=async()=>{try{const name=$('display').value.trim();if(name.length<2)throw Error('顯示名稱至少 2 字元');const data=await call(db.auth.signUp({email:$('email').value.trim(),password:$('password').value,options:{data:{display_name:name}}}));msg(data.session?'註冊並登入成功':'註冊成功，請依設定驗證電子郵件後登入')}catch(e){msg(e.message)}};
$('login').onclick=async()=>{try{await call(db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value}));msg('登入成功')}catch(e){msg(e.message)}};
$('logout').onclick=async()=>{await db.auth.signOut();user=null;show('app',false);show('auth')};$('home').onclick=()=>panel('dashboard');$('again').onclick=()=>panel('dashboard');
$('start').onclick=async()=>{try{const mode=$('mode').value,total=Number($('count').value),cat=$('category').value||null;sessionId=await call(db.rpc('start_quiz',{p_mode:mode,p_total:total,p_category:cat}));const links=await call(db.from('quiz_items').select('question_id,position').eq('session_id',sessionId).order('position'));const qs=await call(db.from('questions').select('id,category,difficulty,prompt,options').in('id',links.map(x=>x.question_id)));const map=new Map(qs.map(q=>[q.id,q]));items=links.map(x=>map.get(x.question_id));cursor=0;feedbackMap={};panel('quiz');renderQuestion()}catch(e){msg(e.message)}};
function renderQuestion(){const q=items[cursor];selected=null;submitted=false;$('qtitle').textContent=`第 ${cursor+1} 題 · ${q.category}`;$('progress').textContent=`${cursor+1} / ${items.length}`;$('question').textContent=q.prompt;$('options').innerHTML='';q.options.forEach((o,i)=>{const b=document.createElement('button');b.className='option';b.textContent=`${'ABCD'[i]}. ${o}`;b.onclick=()=>{if(submitted)return;selected=i;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected')};$('options').appendChild(b)});show('feedback',false);show('submit');show('next',false)}
$('submit').onclick=async()=>{if(selected===null){msg('請先選擇答案');return}try{$('submit').disabled=true;const q=items[cursor];const out=await call(db.rpc('submit_answer',{p_session:sessionId,p_question:q.id,p_index:selected}));submitted=true;feedbackMap[q.id]={answer_index:selected,...out};if($('mode').value==='practice'){$('feedback').textContent=`${out.is_correct?'✓ 答對':'✕ 答錯'}｜正解：${'ABCD'[out.correct_index]}\n${out.explanation}`;show('feedback')}show('submit',false);show('next');$('next').textContent=cursor===items.length-1?'交卷看結果':'下一題';msg('')}catch(e){msg(e.message)}finally{$('submit').disabled=false}};
$('next').onclick=async()=>{if(cursor===items.length-1)await finish();else{cursor++;renderQuestion()}};$('finish').onclick=()=>finish();
async function finish(){try{const data=await call(db.rpc('finish_quiz',{p_session:sessionId}));$('score').textContent=`${data.score} / ${data.total} 題正確（${Math.round(data.score/data.total*100)}%）`;const byId=new Map(data.results.map(r=>[r.question_id,r]));$('review').innerHTML=items.map((q,i)=>{const r=byId.get(q.id);if(!r)return '';const correct=r.answer_index===r.correct_index;return `<div class="panel"><b>第 ${i+1} 題｜${escapeHtml(q.prompt)}</b><p class="${correct?'ok':'bad'}">${correct?'正確':'錯誤或未作答'}｜你的答案：${r.answer_index===null?'未作答':escapeHtml(q.options[r.answer_index])}｜正解：${escapeHtml(q.options[r.correct_index])}</p><small>${escapeHtml(r.explanation)}</small></div>`}).join('');panel('result')}catch(e){msg(e.message)}};
$('historyBtn').onclick=async()=>{try{const rows=await call(db.from('quiz_sessions').select('id,mode,status,score,total,started_at,finished_at').eq('user_id',user.id).order('started_at',{ascending:false}).limit(100));$('historyData').innerHTML=rows.length?'<div style="overflow-x:auto"><table><thead><tr><th>刷題者</th><th>時間</th><th>模式</th><th>成績</th><th>狀態</th></tr></thead><tbody>'+rows.map(r=>`<tr><td>${escapeHtml(profile.display_name)}</td><td>${new Date(r.started_at).toLocaleString('zh-TW')}</td><td>${r.mode==='exam'?'模擬測驗':'自由練習'}</td><td>${r.status==='finished'?`${r.score}/${r.total}`:'—'}</td><td>${r.status==='finished'?'已交卷':'未完成'}</td></tr>`).join('')+'</tbody></table></div>':'尚無紀錄';panel('history')}catch(e){msg(e.message)}};
$('leaderBtn').onclick=async()=>{try{const rows=await call(db.rpc('leaderboard'));$('leaderData').innerHTML=rows.length?'<div style="overflow-x:auto"><table><thead><tr><th>刷題者</th><th>完成次數</th><th>平均正確率</th><th>最高正確率</th></tr></thead><tbody>'+rows.map(r=>`<tr><td>${escapeHtml(r.display_name)}</td><td>${r.quizzes}</td><td>${r.avg_percent}%</td><td>${r.best_percent}%</td></tr>`).join('')+'</tbody></table></div>':'目前尚無完成的測驗';panel('leaderboard')}catch(e){msg(e.message)}};
init().catch(e=>msg(e.message));
</script></body></html>
